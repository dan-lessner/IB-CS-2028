<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title data-i18n="page_title">CurveFitEA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div id="lang-switcher">
      <button type="button" id="lang-cs-btn">Čeština</button>
      <button type="button" id="lang-en-btn">English</button>
    </div>
    <h1>CurveFitEA</h1>
    <p class="subtitle" data-i18n="subtitle"></p>
  </header>

  <main>
    <!-- simulation-wrapper drží plochu i prostřední pruh pohromadě jako jeden
         celek (EvoMice spec 14.2, stejná konvence) — je to i požádaný element
         Fullscreen API (viz main.js). #controls (nastavení evoluce) je
         záměrně mimo. -->
    <div id="simulation-wrapper">
      <!-- Plocha — jen samotný canvas, žádné ovládání ani informace uvnitř
           (co největší čtverec z dostupného místa, nic ho nesmí zmenšovat).
           Zoom (CSS zoom na #canvas-container, viz applyZoom v render.js)
           roztáhne canvas-container nad rozměr #canvas-area, čímž se tu
           (overflow: auto) objeví posuvníky pro výřez; tažením pravým
           tlačítkem myši lze výřez posouvat (panning), viz main.js. -->
      <section id="canvas-area">
        <div id="canvas-container">
          <canvas id="sim-canvas"></canvas>
        </div>
      </section>

      <!-- Ovládání běhu evoluce (start/pauza, krok, reset+seed, rychlost),
           zoom, fullscreen a informační řádky (kurzor, statistika, zvýrazněná
           křivka) — v prostředním pruhu MEZI plochou a panelem nastavení, ne
           nad/přes plochu a ne přes nastavení, ať plocha dostane co největší
           dostupný čtverec (stejná konvence jako EvoMice spec 14.2). -->
      <section id="middle-panel">
        <div id="run-controls">
          <span class="btn-with-help">
            <button type="button" id="start-pause-btn"></button>
            <span class="help-icon" tabindex="0" data-i18n-tooltip="start_pause_btn_tooltip">?</span>
          </span>
          <span class="btn-with-help">
            <button type="button" id="step-btn" data-i18n="step_btn"></button>
            <span class="help-icon" tabindex="0" data-i18n-tooltip="step_btn_tooltip">?</span>
          </span>
          <span class="btn-with-help">
            <button type="button" id="reset-btn" data-i18n="reset_btn"></button>
            <span class="help-icon" tabindex="0" data-i18n-tooltip="reset_btn_tooltip">?</span>
          </span>
          <!-- Seed patří k resetu (stejná konvence jako EvoMice 13.10) —
               reset tlačítko výš vždycky čte aktuální hodnotu tohodle pole. -->
          <label id="seed-control" for="seed-input">
            <span data-i18n="seed_label"></span>
            <span class="help-icon" tabindex="0" data-i18n-tooltip="seed_label_tooltip">?</span>
            <input type="number" id="seed-input" value="42" step="1">
          </label>
          <label id="speed-control" for="speed-slider">
            <span data-i18n="speed_label"></span>
            <span class="help-icon" tabindex="0" data-i18n-tooltip="speed_label_tooltip">?</span>
            <span id="speed-value">2</span>
            <input type="range" id="speed-slider" min="0" max="30" step="1" value="2">
          </label>

          <span class="btn-with-help">
            <button type="button" id="fullscreen-btn"></button>
            <span class="help-icon" tabindex="0" data-i18n-tooltip="fullscreen_btn_tooltip">?</span>
          </span>
          <!-- Zoom patří k zobrazení plochy, ne k nastavení evoluce (stejná
               konvence jako EvoMice 12.3) — proto je tady vedle fullscreen
               tlačítka, ne ve fieldsetu nastavení. -->
          <label id="zoom-control" for="zoom-slider">
            <span data-i18n="zoom_label"></span>
            <span class="help-icon" tabindex="0" data-i18n-tooltip="zoom_label_tooltip">?</span>
            <input type="range" id="zoom-slider" min="0.5" max="4" step="0.1" value="1">
          </label>
        </div>

        <p id="stats-line"></p>
        <p id="cursor-position-line" data-i18n="cursor_position_none"></p>
        <p id="highlighted-curve-line" data-i18n="highlighted_curve_none"></p>
      </section>
    </div>

    <aside id="controls">

      <fieldset>
        <legend>
          <span data-i18n="section_degree_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_degree_legend_tooltip">?</span>
        </legend>
        <label for="degree-slider">
          <span data-i18n="degree_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="degree_label_tooltip">?</span>
          <span id="degree-value">1</span>
          <input type="range" id="degree-slider" min="1" max="8" step="1" value="1">
        </label>
        <label>
          <input type="checkbox" id="degree-evolves-checkbox">
          <span data-i18n="degree_evolves_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="degree_evolves_label_tooltip">?</span>
        </label>
        <label for="degree-mutation-rate-slider"
               data-show-when-checkbox="degree-evolves-checkbox" data-show-when-checked="true">
          <span data-i18n="degree_mutation_rate_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="degree_mutation_rate_label_tooltip">?</span>
          <span id="degree-mutation-rate-value">0.1</span>
          <input type="range" id="degree-mutation-rate-slider" min="0" max="1" step="0.05" value="0.1">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_population_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_population_legend_tooltip">?</span>
        </legend>
        <label for="population-size-slider">
          <span data-i18n="population_size_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="population_size_label_tooltip">?</span>
          <span id="population-size-value">60</span>
          <input type="range" id="population-size-slider" min="1" max="300" step="1" value="60">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_display_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_display_legend_tooltip">?</span>
        </legend>
        <label>
          <input type="checkbox" id="history-toggle-checkbox">
          <span data-i18n="history_toggle_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="history_toggle_label_tooltip">?</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_fitness_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_fitness_legend_tooltip">?</span>
        </legend>
        <label for="fitness-type-select">
          <span data-i18n="fitness_type_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="fitness_type_label_tooltip">?</span>
          <select id="fitness-type-select">
            <option value="sse" data-i18n="fitness_sse"></option>
            <option value="mae" data-i18n="fitness_mae"></option>
            <option value="max-error" data-i18n="fitness_max_error"></option>
            <option value="hit-count" data-i18n="fitness_hit_count"></option>
          </select>
        </label>
        <label for="fitness-tolerance-slider"
               data-show-when-select="fitness-type-select" data-show-when-value="hit-count">
          <span data-i18n="fitness_tolerance_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="fitness_tolerance_label_tooltip">?</span>
          <span id="fitness-tolerance-value">1</span>
          <input type="range" id="fitness-tolerance-slider" min="0.1" max="5" step="0.1" value="1">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_selection_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_selection_legend_tooltip">?</span>
        </legend>
        <label for="selection-method-select">
          <span data-i18n="selection_method_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="selection_method_label_tooltip">?</span>
          <select id="selection-method-select">
            <option value="roulette" data-i18n="selection_roulette"></option>
            <option value="tournament" data-i18n="selection_tournament"></option>
          </select>
        </label>
        <!-- Vidět jen pro turnajovou selekci (stejná konvence jako EvoMice
             13.8) — jinde nedává smysl, ne jen dočasně. -->
        <label for="tournament-size-slider"
               data-show-when-select="selection-method-select" data-show-when-value="tournament">
          <span data-i18n="tournament_size_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="tournament_size_label_tooltip">?</span>
          <span id="tournament-size-value">3</span>
          <input type="range" id="tournament-size-slider" min="2" max="10" step="1" value="3">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_crossover_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_crossover_legend_tooltip">?</span>
        </legend>
        <label for="crossover-rate-slider">
          <span data-i18n="crossover_rate_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="crossover_rate_label_tooltip">?</span>
          <span id="crossover-rate-value">0.8</span>
          <input type="range" id="crossover-rate-slider" min="0" max="1" step="0.05" value="0.8">
        </label>
        <label for="crossover-type-select">
          <span data-i18n="crossover_type_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="crossover_type_label_tooltip">?</span>
          <select id="crossover-type-select">
            <option value="one-point" data-i18n="crossover_one_point"></option>
            <option value="multi-point" data-i18n="crossover_multi_point"></option>
            <option value="uniform" data-i18n="crossover_uniform"></option>
            <option value="param-alternate" data-i18n="crossover_param_alternate"></option>
            <option value="line-point" data-i18n="crossover_line_point"></option>
          </select>
        </label>
        <label for="crossover-points-slider"
               data-show-when-select="crossover-type-select" data-show-when-value="multi-point">
          <span data-i18n="crossover_points_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="crossover_points_label_tooltip">?</span>
          <span id="crossover-points-value">3</span>
          <input type="range" id="crossover-points-slider" min="2" max="8" step="1" value="3">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_genome_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_genome_legend_tooltip">?</span>
        </legend>
        <label for="genome-transform-select">
          <span data-i18n="genome_transform_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="genome_transform_label_tooltip">?</span>
          <select id="genome-transform-select">
            <option value="direct" data-i18n="genome_transform_direct"></option>
            <option value="normalized" data-i18n="genome_transform_normalized"></option>
          </select>
        </label>
        <label for="genome-numeric-select">
          <span data-i18n="genome_numeric_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="genome_numeric_label_tooltip">?</span>
          <select id="genome-numeric-select">
            <option value="integer" data-i18n="genome_numeric_integer"></option>
            <option value="fixed" data-i18n="genome_numeric_fixed"></option>
            <option value="float" data-i18n="genome_numeric_float"></option>
          </select>
        </label>
        <label for="genome-fixed-bits-slider"
               data-show-when-select="genome-numeric-select" data-show-when-value="fixed">
          <span data-i18n="genome_fixed_bits_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="genome_fixed_bits_label_tooltip">?</span>
          <span id="genome-fixed-bits-value">8</span>
          <input type="range" id="genome-fixed-bits-slider" min="2" max="20" step="1" value="8">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_mutation_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_mutation_legend_tooltip">?</span>
        </legend>
        <label for="mutation-type-select">
          <span data-i18n="mutation_type_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="mutation_type_label_tooltip">?</span>
          <select id="mutation-type-select">
            <option value="bit-flip" data-i18n="mutation_bit_flip"></option>
            <option value="gaussian-jump" data-i18n="mutation_gaussian_jump"></option>
          </select>
        </label>
        <label for="mutation-rate-slider"
               data-show-when-select="mutation-type-select" data-show-when-value="bit-flip">
          <span data-i18n="mutation_rate_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="mutation_rate_label_tooltip">?</span>
          <span id="mutation-rate-value">0.02</span>
          <input type="range" id="mutation-rate-slider" min="0" max="0.3" step="0.005" value="0.02">
        </label>
        <label for="mutation-sigma-slider"
               data-show-when-select="mutation-type-select" data-show-when-value="gaussian-jump">
          <span data-i18n="mutation_sigma_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="mutation_sigma_label_tooltip">?</span>
          <span id="mutation-sigma-value">0.3</span>
          <input type="range" id="mutation-sigma-slider" min="0.01" max="3" step="0.01" value="0.3">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_elitism_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_elitism_legend_tooltip">?</span>
        </legend>
        <!-- Náhrada generace nad elitismem (stejná konvence jako EvoMice
             13.9) — jsou to dvě nezávislé osy, viz tooltipy. -->
        <label for="replacement-mode-select">
          <span data-i18n="replacement_mode_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="replacement_mode_label_tooltip">?</span>
          <select id="replacement-mode-select">
            <option value="full" data-i18n="replacement_full"></option>
            <option value="partial" data-i18n="replacement_partial"></option>
          </select>
        </label>
        <label for="replacement-percent-slider"
               data-show-when-select="replacement-mode-select" data-show-when-value="partial">
          <span data-i18n="replacement_percent_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="replacement_percent_label_tooltip">?</span>
          <span id="replacement-percent-value">50</span>
          <input type="range" id="replacement-percent-slider" min="1" max="100" step="1" value="50">
        </label>
        <label for="elite-count-slider">
          <span data-i18n="elite_count_label"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="elite_count_label_tooltip">?</span>
          <span id="elite-count-value">0</span>
          <input type="range" id="elite-count-slider" min="0" max="20" step="1" value="0">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <span data-i18n="section_reset_legend"></span>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="section_reset_legend_tooltip">?</span>
        </legend>
        <span class="btn-with-help">
          <button type="button" id="reset-defaults-btn" data-i18n="reset_defaults_btn"></button>
          <span class="help-icon" tabindex="0" data-i18n-tooltip="reset_defaults_btn_tooltip">?</span>
        </span>
      </fieldset>

    </aside>
  </main>

  <!-- Pořadí scriptů je důležité: žádný build krok, sdílejí globální scope. -->
  <!-- i18n musí být načtené první — slovníky a mechanika překladu, na které
       se odkazují všechny ostatní moduly (statické texty i ty generované za
       běhu v main.js). -->
  <script src="js/i18n/cs.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/model.js"></script>
  <script src="js/ga.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
  <!-- defaults.js záměrně poslední: potřebuje resetEverything()/
       refreshSliderDisplays()/... z main.js a nejdřív se má proběhnout
       výchozí inicializace, než ho tenhle skript aplikací DEFAULT_SETTINGS
       případně přepíše. -->
  <script src="js/defaults.js"></script>
</body>
</html>
